<!DOCTYPE html>
<html>
<head>

    <style>
        #weatherImage {
            width: 500px;
            margin-top: 20px;

        }
        #error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Select District</h2>

    <select id="citySelect">

        <option value="Khulna">Khulna</option>
    </select>

    <button onclick="showWeather()">Show Weather</button>

    <p id="error"></p>
    <img id="weatherImage" src="" alt="Weather Image">


<script src="js/weather.js"></script>
</body>
</html>
